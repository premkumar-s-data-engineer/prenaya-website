<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Prenaya</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-page">

  <div class="login-card">
    <h1>Prenaya</h1>
    <p class="login-subtitle">Admin Panel</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="admin@prenaya.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="Your password">
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="login-btn">Log In</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-auth.js"></script>
</body>
</html>
