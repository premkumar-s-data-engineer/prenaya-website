<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colours — Prenaya Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- Mobile topbar -->
  <div class="admin-topbar" id="admin-topbar"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main content -->
  <main class="admin-main">

    <div class="dashboard-toolbar">
      <h1>Colours</h1>
    </div>

    <p class="admin-help-text">
      This is your master colour palette. Products can offer any subset of
      these colours for customers to choose from. Add, rename, or recolour
      here any time.
    </p>

    <!-- Add colour form -->
    <div class="cat-add-form" id="add-color-form">
      <div class="cat-add-fields">
        <input type="text" id="new-color-name" placeholder="Colour name, e.g. Turquoise" autocomplete="off">
        <div class="color-add-swatch-row">
          <label for="new-color-hex" class="color-swatch-label">Swatch</label>
          <input type="color" id="new-color-hex" value="#F4D03F" class="color-input">
        </div>
      </div>
      <button class="btn btn-primary btn-sm" id="add-color-btn">Add Colour</button>
    </div>

    <!-- Colour list -->
    <div id="color-list">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading colours...</p>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-colors.js"></script>
</body>
</html>
