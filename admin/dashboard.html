<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Prenaya Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- Mobile topbar -->
  <div class="admin-topbar" id="admin-topbar"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main content -->
  <main class="admin-main">

    <div class="dashboard-toolbar">
      <h1>Products</h1>
      <a href="product-form.html" class="btn btn-primary btn-sm">+ Add Product</a>
    </div>

    <!-- Search bar -->
    <div class="search-bar">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="product-search" placeholder="Search products by name..." autocomplete="off">
      <button class="search-clear" id="search-clear" aria-label="Clear search">&times;</button>
    </div>
    <div class="search-count hidden" id="search-count"></div>

    <!-- Category filter tabs -->
    <div class="admin-filter-bar" id="admin-filter-bar"></div>

    <div id="product-list">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading products...</p>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
